name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Extract Android project
        run: |
          unzip -o hava-durumu-apk-duzeltilmis.zip -d .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo 'android.disallowKotlinSourceSets=false' >> gradle.properties
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hava-Durumu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
